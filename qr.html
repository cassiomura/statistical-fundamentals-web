<!doctype html>
<!--
  Statistical Fundamentals, the web version: a QR code of the site's own address, large, for a presenter to show on
  a screen so that the room opens the laboratory on their phones. Its texts come from the catalogs (texts.json); the
  QR code is drawn in the page by qrcodejs (cdnjs, an exact version).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js https://cdn.jsdelivr.net/pyodide/v0.29.5/full/ 'wasm-unsafe-eval'; worker-src 'self'; connect-src 'self' https://cdn.jsdelivr.net/pyodide/v0.29.5/full/; img-src 'self' data: blob:; media-src 'self'; style-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Statistical Fundamentals</title>
<link rel="icon" href="icons/app.svg" type="image/svg+xml">
<link rel="stylesheet" href="theme.css?v=b99704786ba7">
<link rel="stylesheet" href="qr.css?v=b99704786ba7">
</head>
<body>
<main>
  <h1 id="title"></h1>
  <p id="lead"></p>
  <div id="code" role="img"></div>
  <div class="address" id="address"></div>
  <a href="./" id="back"></a>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" integrity="sha512-CNgIRecGo7nphbeZ04Sc13ka07paqdeTu0WR1IM4kNcpmBAUSHSQX0FslNhTDadL4O5SAGapGt4FodqL8My0mA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="qr.js?v=b99704786ba7"></script>
</body>
</html>
